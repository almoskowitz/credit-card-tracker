<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Credit Card Rewards Tracker</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1220" />

    <!-- iOS home-screen install: no service worker, just the standalone/status-bar hints and the touch icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` triggers a WebKit standalone/viewport-fit bug where
         the initial containing block ends safe-area-inset-top pixels above the
         physical bottom of the display. `black` keeps the status bar opaque and
         gives the page a correctly aligned viewport below it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Card Tracker" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
