<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Rewards Tracker - Full Featured</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1a2540 55%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            line-height: 1.5;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:

                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.06) 0%, transparent 45%);
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 1rem;
            padding: 0.75rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        .stats {
            display: flex;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            overflow: hidden;
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.4);
        }

        .stat-box {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            transition: background 0.2s;
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-box:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .stat-sub {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 0.25rem;
        }

        /* ── Card grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .card-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card-section:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-1px);
        }

        /* Issuer accent on top edge */
        .card-section.issuer-amex         { box-shadow: inset 0 3px 0 #c9a357, 0 2px 12px rgba(0,0,0,0.4); }
        .card-section.issuer-chase        { box-shadow: inset 0 3px 0 #1a8fe3, 0 2px 12px rgba(0,0,0,0.4); }
        .card-section.issuer-capital-one  { box-shadow: inset 0 3px 0 #e04535, 0 2px 12px rgba(0,0,0,0.4); }
        .card-section.issuer-citi         { box-shadow: inset 0 3px 0 #0073cf, 0 2px 12px rgba(0,0,0,0.4); }
        .card-section.issuer-barclays     { box-shadow: inset 0 3px 0 #00aeef, 0 2px 12px rgba(0,0,0,0.4); }
        .card-section.issuer-boa          { box-shadow: inset 0 3px 0 #cc1f36, 0 2px 12px rgba(0,0,0,0.4); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.75rem 0.875rem 0.5rem;
            cursor: pointer;
        }

        .card-header-left { flex: 1; }

        .card-name {
            font-size: 0.875rem;
            font-weight: 700;
            line-height: 1.2;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .card-issuer {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.2rem;
        }

        .profile-badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            background: rgba(236, 72, 153, 0.25);
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 8px;
            font-size: 0.6rem;
            margin-left: 0.4rem;
            vertical-align: middle;
        }

        /* Stats row */
        .card-stats {
            display: flex;
            gap: 0;
            padding: 0 0.875rem 0.5rem;
            align-items: center;
        }

        .card-stat { flex: 1; }

        .card-stat-label {
            font-size: 0.575rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.45);
        }

        .card-stat-value {
            font-size: 0.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .card-stat-value.recovery-high   { color: #34d399; }
        .card-stat-value.recovery-mid    { color: #fbbf24; }
        .card-stat-value.recovery-low    { color: #f87171; }

        /* Thin progress bar */
        .card-progress {
            margin: 0 0.875rem 0.5rem;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .card-progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .card-progress-fill.recovery-high { background: linear-gradient(90deg, #34d399, #10b981); }
        .card-progress-fill.recovery-mid  { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .card-progress-fill.recovery-low  { background: linear-gradient(90deg, #f87171, #ef4444); }

        /* Benefit chips strip */
        .tile-benefits {
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding: 0.5rem 0.875rem 0.625rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            cursor: pointer;
        }

        .tile-benefit-chip {
            font-size: 0.65rem;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.75);
            white-space: nowrap;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tile-benefit-chip.type-dining { background: rgba(251, 146, 60, 0.15); border-color: rgba(251, 146, 60, 0.3); }
        .tile-benefit-chip.type-travel { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
        .tile-benefit-chip.type-shop   { background: rgba(167, 139, 250, 0.15); border-color: rgba(167, 139, 250, 0.3); }
        .tile-benefit-chip.used        { opacity: 0.4; text-decoration: line-through; }

        .tile-no-benefits {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            font-style: italic;
        }

        .toggle {
            color: rgba(255, 255, 255, 0.8);
            transition: transform 0.2s;
            font-size: 0.7rem;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .toggle.open { transform: rotate(180deg); }

        .benefits-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .benefits-container.open {
            max-height: 3000px;
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.625rem;
            margin-top: 0.875rem;
            padding: 0.75rem;
        }

        .benefit {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
        }

        .benefit:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateY(-1px);
        }

        .benefit.used {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.35);
        }

        /* Benefit type tints */
        .benefit.type-dining { background: rgba(251, 146, 60, 0.1); border-color: rgba(251, 146, 60, 0.25); }
        .benefit.type-travel { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.25); }
        .benefit.type-shop   { background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.25); }
        .benefit.type-dining:hover { background: rgba(251, 146, 60, 0.16); }
        .benefit.type-travel:hover { background: rgba(56, 189, 248, 0.16); }
        .benefit.type-shop:hover   { background: rgba(167, 139, 250, 0.16); }
        /* used state always wins */
        .benefit.used { background: rgba(16, 185, 129, 0.15) !important; border-color: rgba(16, 185, 129, 0.35) !important; }


        .benefit.used::after {
            content: '✓';
            position: absolute;
            top: 0.75rem; right: 0.75rem;
            font-size: 1.25rem;
            color: #10b981;
            filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.8));
        }

        .benefit-name {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        .benefit-type {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 0.25rem;
        }

        .benefit-value {
            font-size: 1rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-top: 0.25rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-bottom: 0.3rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn {
            padding: 0.875rem 2rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s;
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.3);
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }

        .actions-bar {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: rgba(30, 27, 75, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal h2 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-select option {

        }

        .form-textarea {

        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .card-option {
            background: rgba(255, 255, 255, 0.1);

            padding: 1rem;
            margin-bottom: 0.75rem;

        }

        .card-option:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .profile-list {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .profile-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .spending-input-group {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1rem;
        }

        .spending-label {
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .spending-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
        }

        .benefit-list {
            display: grid;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .benefit-list-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .empty {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .hud-title {
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
        }

        .hud-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .toggle-chip {
            padding: 0.3rem 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.2s;
            font-family: inherit;
        }

        .toggle-chip:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .toggle-chip.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        .btn-icon {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1;
        }

        .card-header:hover .btn-icon {
            color: rgba(255, 255, 255, 0.45);
        }

        .btn-icon:hover {
            color: #ff6b6b !important;
            background: rgba(255, 80, 80, 0.15);
        }

        @media (max-width: 768px) {
            .container { padding: 0.75rem; }
            .stats { flex-direction: column; }
            .stat-box { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
            .stat-box:last-child { border-bottom: none; }
            .cards-grid { grid-template-columns: 1fr; }
            .benefits-grid, .spending-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

quired":20000,"yearType":"Membership Year"}],"multipliers":{"AA Purchases":2,"Everything Else":1}}};
        
        const SPENDING_CATEGORIES = [
            "Dining", "Supermarkets", "Gas Stations", "Travel", "Hotels",
            "Flights", "Office Supply", "Internet/Cable/Phone", "Shipping",
            "Drugstores", "Rideshare", "Streaming", "Everything Else"
        ];

        const getCurrentMonth = () => new Date().getMonth() + 1;
        const getCurrentQuarter = () => Math.ceil(getCurrentMonth() / 3);
        const getCurrentHalf = () => getCurrentMonth() <= 6 ? 1 : 2;
        const getCurrentYear = () => new Date().getFullYear();

        const getPeriodKey = (frequency, period) => {
            const year = getCurrentYear();
            if (frequency === 'Monthly' && period) return `${year}-${period}`;
            if (frequency === 'Quarterly' && period) return `${year}-${period}`;
            if (frequency === 'Semi-Annual' && period) return `${year}-${period}`;
            if (frequency === 'Annual') return `${year}`;
            return `${year}-M${getCurrentMonth()}`;
        };

        const isCurrentPeriod = (benefit) => {
            if (benefit.frequency === 'Monthly') {
                if (benefit.period && benefit.period.startsWith('M')) {
                    return parseInt(benefit.period.substring(1)) === getCurrentMonth();
                }
                return true;
            }
            if (benefit.frequency === 'Quarterly') return benefit.period === `Q${getCurrentQuarter()}`;
            if (benefit.frequency === 'Semi-Annual') return benefit.period === `H${getCurrentHalf()}`;
            if (benefit.frequency === 'Annual') return true;
            return false;
        };

        function ProgressCircle({ percentage }) {
            const size = 44;
            const strokeWidth = 4;
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percentage / 100) * circumference;

            return (
                <div className="progress-circle">
                    <svg className="progress-svg" viewBox={`0 0 ${size} ${size}`}>
                        <circle className="progress-bg" cx={size/2} cy={size/2} r={radius} />
                        <circle 
                            className="progress-bar" 
                            cx={size/2} cy={size/2} r={radius}
                            strokeDasharray={circumference}
                            strokeDashoffset={offset}
                        />
                    </svg>
                    <div className="progress-text">{Math.round(percentage)}%</div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [profiles, setProfiles] = useState([]);
            const [cards, setCards] = useState([]);
            const [cardDatabase, setCardDatabase] = useState(INITIAL_CARD_DATABASE);
            const [expandedCards, setExpandedCards] = useState({});
            const [usedBenefits, setUsedBenefits] = useState({});
            const [annualSpending, setAnnualSpending] = useState({});
            
            const [showUnusedOnly, setShowUnusedOnly] = useState(false);
            const [hudExpanded, setHudExpanded] = useState(false);
            const [hudSections, setHudSections] = useState({ Monthly: true, Quarterly: false, 'Semi-Annual': false, Annual: false });
            const [editingBenefitIdx, setEditingBenefitIdx] = useState(null);
            const [editingBenefitData, setEditingBenefitData] = useState(null);

            const [showAddCardModal, setShowAddCardModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showDatabaseModal, setShowDatabaseModal] = useState(false);
            const [showEditCardModal, setShowEditCardModal] = useState(false);
            const [showEditBenefitsModal, setShowEditBenefitsModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            
            const [selectedProfile, setSelectedProfile] = useState('');
            const [newProfileName, setNewProfileName] = useState('');
            const [editingCardName, setEditingCardName] = useState('');
            const [newCardForm, setNewCardForm] = useState({ name: '', issuer: '', annualFee: 0 });
            const [newBenefitForm, setNewBenefitForm] = useState({
                name: '', type: 'Dining', frequency: 'Monthly', value: 0, period: ''
            });

            useEffect(() => {
                loadData();
            }, []);

            const loadData = () => {
                try {
                    const profilesData = localStorage.getItem('profiles');
                    const cardsData = localStorage.getItem('cards');
                    const databaseData = localStorage.getItem('card-database');
                    const benefitsData = localStorage.getItem('used-benefits');
                    const spendingData = localStorage.getItem('annual-spending');
                    
                    if (profilesData) setProfiles(JSON.parse(profilesData));
                    if (cardsData) setCards(JSON.parse(cardsData));
                    if (databaseData) setCardDatabase(JSON.parse(databaseData));
                    if (benefitsData) setUsedBenefits(JSON.parse(benefitsData));
                    if (spendingData) setAnnualSpending(JSON.parse(spendingData));
                } catch (error) {
                    console.log('No saved data');
                }
            };

            const saveData = () => {
                try {
                    localStorage.setItem('profiles', JSON.stringify(profiles));
                    localStorage.setItem('cards', JSON.stringify(cards));
                    localStorage.setItem('card-database', JSON.stringify(cardDatabase));
                    localStorage.setItem('used-benefits', JSON.stringify(usedBenefits));
                    localStorage.setItem('annual-spending', JSON.stringify(annualSpending));
                } catch (error) {
                    console.error('Save error:', error);
                }
            };

            useEffect(() => {
                if (profiles.length > 0 || cards.length > 0 || Object.keys(cardDatabase).length > 0) {
                    saveData();
                }
            }, [profiles, cards, cardDatabase, usedBenefits, annualSpending]);

            const addProfile = () => {
                if (newProfileName.trim()) {
                    setProfiles([...profiles, { id: `prof-${Date.now()}`, name: newProfileName.trim() }]);
                    setNewProfileName('');
                }
            };

            const deleteProfile = (profileId) => {
                setProfiles(profiles.filter(p => p.id !== profileId));
                setCards(cards.filter(c => c.profileId !== profileId));
            };

            const addCard = (cardName, profileId) => {
                if (cardDatabase[cardName] && profileId) {
                    setCards([...cards, { id: `card-${Date.now()}`, profileId, cardName }]);
                    setShowAddCardModal(false);
                    setSelectedProfile('');
                }
            };

            const removeCard = (cardId) => {
                setCards(cards.filter(c => c.id !== cardId));
            };

            const addCardToDatabase = () => {
                if (newCardForm.name && newCardForm.issuer) {
                    setCardDatabase({
                        ...cardDatabase,
                        [newCardForm.name]: {
                            issuer: newCardForm.issuer,
                            annualFee: parseFloat(newCardForm.annualFee) || 0,
                            periodicBenefits: [],
                            multipliers: { "Everything Else": 1 }
                        }
                    });
                    setNewCardForm({ name: '', issuer: '', annualFee: 0 });
                    setShowDatabaseModal(false);
                }
            };

            const addBenefitToCard = () => {
                if (editingCardName && newBenefitForm.name) {
                    const card = cardDatabase[editingCardName];
                    const rawVal = newBenefitForm.value;
                    const numVal = parseFloat(rawVal);
                    const benefit = {
                        name: newBenefitForm.name,
                        type: newBenefitForm.type,
                        frequency: newBenefitForm.frequency,
                        value: isNaN(numVal) ? (rawVal || 0) : numVal,
                        period: newBenefitForm.period || undefined,
                    };
                    if (newBenefitForm.monetaryValue) benefit.monetaryValue = parseFloat(newBenefitForm.monetaryValue);
                    setCardDatabase({ ...cardDatabase, [editingCardName]: { ...card, periodicBenefits: [...(card.periodicBenefits || []), benefit] } });
                    setNewBenefitForm({ name: '', type: 'Dining', frequency: 'Monthly', value: '', period: '' });
                }
            };

            const updateBenefitInCard = (cardName, idx, updated) => {
                const card = cardDatabase[cardName];
                const updatedBenefits = card.periodicBenefits.map((b, i) => i === idx ? updated : b);
                setCardDatabase({ ...cardDatabase, [cardName]: { ...card, periodicBenefits: updatedBenefits } });
            };

            const removeBenefitFromCard = (cardName, benefitIndex) => {
                const card = cardDatabase[cardName];
                setCardDatabase({ ...cardDatabase, [cardName]: { ...card, periodicBenefits: card.periodicBenefits.filter((_, i) => i !== benefitIndex) } });
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (imported.profiles) setProfiles(imported.profiles);
                            if (imported.cards) setCards(imported.cards);
                            if (imported.cardDatabase) setCardDatabase(imported.cardDatabase);
                            if (imported.usedBenefits) setUsedBenefits(imported.usedBenefits);
                            if (imported.annualSpending) setAnnualSpending(imported.annualSpending);
                            setShowImportModal(false);
                            alert('Data imported successfully!');
                        } catch (error) {
                            alert('Error importing data. Please check the file format.');
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const toggleCard = (cardId) => {
                setExpandedCards(prev => ({ ...prev, [cardId]: !prev[cardId] }));
            };

            const toggleBenefit = (cardId, benefitIndex, benefit) => {
                if (!isCurrentPeriod(benefit)) return;
                const periodKey = getPeriodKey(benefit.frequency, benefit.period);
                const key = `${cardId}-${benefitIndex}-${periodKey}`;
                setUsedBenefits(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const isBenefitUsed = (cardId, benefitIndex, benefit) => {
                const periodKey = getPeriodKey(benefit.frequency, benefit.period);
                const key = `${cardId}-${benefitIndex}-${periodKey}`;
                return usedBenefits[key] || false;
            };

            // Merges wallet card (id/profileId/cardName) with live database data so edits propagate instantly
            const resolveCard = (wc) => {
                const db = cardDatabase[wc.cardName];
                if (db) return { ...db, id: wc.id, profileId: wc.profileId, cardName: wc.cardName };
                // Fallback for old embedded-data wallet cards or missing db entries
                return { periodicBenefits: [], multipliers: {}, annualFee: 0, issuer: 'Unknown', ...wc };
            };

            const benefitStatValue = (benefit) =>
                benefit.monetaryValue !== undefined ? benefit.monetaryValue :
                (typeof benefit.value === 'number' ? benefit.value : 0);

            const calculateCardStats = (card) => {
                let totalAnnualValue = 0, usedAnnualValue = 0;
                let currentPeriodTotal = 0, currentPeriodUsed = 0;
                card.periodicBenefits.forEach((benefit, idx) => {
                    const val = benefitStatValue(benefit);
                    const isUsed = isBenefitUsed(card.id, idx, benefit);
                    totalAnnualValue += val;
                    if (isUsed) usedAnnualValue += val;
                    if (isCurrentPeriod(benefit)) {
                        currentPeriodTotal += val;
                        if (isUsed) currentPeriodUsed += val;
                    }
                });
                const recovery = card.annualFee > 0 ? (usedAnnualValue / card.annualFee) * 100 : 0;
                return { totalAnnualValue, usedAnnualValue, recovery: Math.min(recovery, 100), currentPeriodTotal, currentPeriodUsed };
            };

            const getTotalStats = () => {
                let totalFees = 0, totalRecovered = 0;
                cards.map(resolveCard).forEach(card => {
                    const stats = calculateCardStats(card);
                    totalFees += card.annualFee;
                    totalRecovered += stats.usedAnnualValue;
                });
                return { totalFees, totalRecovered, overallRecovery: totalFees > 0 ? (totalRecovered / totalFees) * 100 : 0, netCost: Math.max(0, totalFees - totalRecovered) };
            };

            const getBestCardForCategory = (category) => {
                let bestCard = null, bestMultiplier = 0;
                cards.map(resolveCard).forEach(card => {
                    if (!card.multipliers) return;
                    Object.entries(card.multipliers).forEach(([cat, mult]) => {
                        const catLower = cat.toLowerCase();
                        const categoryLower = category.toLowerCase();
                        if (catLower.includes(categoryLower) || categoryLower.includes(catLower.split(' ')[0])) {
                            if (mult > bestMultiplier) { bestMultiplier = mult; bestCard = card.cardName; }
                        }
                    });
                });
                return { card: bestCard || 'None', multiplier: bestMultiplier };
            };

            const calculateOptimalWallet = (walletSize) => {
                const totalSpending = Object.values(annualSpending).reduce((a, b) => a + b, 0);
                const cardScores = {};
                cards.map(resolveCard).forEach(card => {
                    if (!card.multipliers) return;
                    let score = 0;
                    if (totalSpending > 0) {
                        SPENDING_CATEGORIES.forEach(category => {
                            const spending = annualSpending[category] || 0;
                            if (spending === 0) return;
                            let bestMult = card.multipliers['Everything Else'] || card.multipliers['Everything'] || 1;
                            Object.entries(card.multipliers).forEach(([cat, mult]) => {
                                const catLower = cat.toLowerCase();
                                if (catLower.includes(category.toLowerCase()) || category.toLowerCase().includes(catLower.split(' ')[0])) {
                                    if (mult > bestMult) bestMult = mult;
                                }
                            });
                            score += spending * bestMult;
                        });
                    } else {
                        Object.values(card.multipliers).forEach(mult => { score += mult; });
                    }
                    cardScores[card.cardName] = score;
                });
                return Object.entries(cardScores).sort((a, b) => b[1] - a[1]).slice(0, walletSize).map(([name, score]) => ({ name, score: Math.round(score) }));
            };

            const getProfileName = (profileId) => {
                const profile = profiles.find(p => p.id === profileId);
                return profile ? profile.name : 'Unknown';
            };

            const getIssuerClass = (issuer) => {
                if (!issuer) return '';
                const i = issuer.toLowerCase();
                if (i.includes('american express')) return 'issuer-amex';
                if (i.includes('chase')) return 'issuer-chase';
                if (i.includes('capital one')) return 'issuer-capital-one';
                if (i.includes('citi')) return 'issuer-citi';
                if (i.includes('barclays')) return 'issuer-barclays';
                if (i.includes('bank of america')) return 'issuer-boa';
                return '';
            };

            const getBenefitTypeClass = (type) => {
                if (!type) return '';
                switch (type.toLowerCase()) {
                    case 'dining': return 'type-dining';
                    case 'travel': return 'type-travel';
                    case 'shop':   return 'type-shop';
                    default: return '';
                }
            };

            const totalStats = getTotalStats();

            const URGENCY_ORDER = { 'Monthly': 0, 'Quarterly': 1, 'Semi-Annual': 2, 'Annual': 3 };

            const renderDashboard = () => {
                // Pre-compute HUD benefits: sorted by urgency, optionally filtered to unused
                const hudBenefits = [];
                cards.forEach(wc => {
                    const card = resolveCard(wc);
                    card.periodicBenefits.forEach((benefit, idx) => {
                        if (!isCurrentPeriod(benefit)) return;
                        const isUsed = isBenefitUsed(card.id, idx, benefit);
                        if (showUnusedOnly && isUsed) return;
                        hudBenefits.push({ card, benefit, originalIndex: idx, isUsed });
                    });
                });
                hudBenefits.sort((a, b) =>
                    (URGENCY_ORDER[a.benefit.frequency] || 0) - (URGENCY_ORDER[b.benefit.frequency] || 0)
                );

                return (
                <>
                    <div className="stats">
                        <div className="stat-box">
                            <div className="stat-label">Annual Fees</div>
                            <div className="stat-value">${totalStats.totalFees.toLocaleString()}</div>
                            <div className="stat-sub">{cards.length} card{cards.length !== 1 ? 's' : ''}</div>

                        </div>

                            <div className="stat-label">Recovery Rate</div>
                            <div className="stat-value">{Math.round(totalStats.overallRecovery)}%</div>
                            <div className="stat-sub">{totalStats.overallRecovery >= 100 ? 'Fees fully offset' : 'of annual fees'}</div>

                        <div className="stat-box">
                            <div className="stat-label">Net Cost</div>
                            <div className="stat-value">${Math.round(totalStats.netCost).toLocaleString()}</div>

                                    <div className="hud-title" onClick={() => setHudExpanded(!hudExpanded)}>

                                            <span style={{fontSize: '0.7rem', color: 'rgba(255,255,255,0.5)', fontWeight: 400}}>
                                                {hudBenefits.length} benefit{hudBenefits.length !== 1 ? 's' : ''} available this period

                                        )}
                                    </div>

                                        <div className="hud-controls">

                                                className={`toggle-chip ${showUnusedOnly ? 'active' : ''}`}

                                            >
                                                {showUnusedOnly ? 'Unused Only ✓' : 'Show All'}
                                            </button>
                                        </div>
                                    )}
                                </div>
                                {hudExpanded && (
                                    <div style={{marginTop: '0.75rem'}}>
                                        {['Monthly', 'Quarterly', 'Semi-Annual', 'Annual'].map(freq => {
                                            const freqBenefits = hudBenefits.filter(b => b.benefit.frequency === freq);
                                            if (freqBenefits.length === 0) return null;
                                            const isOpen = hudSections[freq];
                                            const unusedCount = freqBenefits.filter(b => !b.isUsed).length;
                                            const totalVal = freqBenefits.reduce((sum, b) => sum + (b.benefit.monetaryValue !== undefined ? b.benefit.monetaryValue : typeof b.benefit.value === 'number' ? b.benefit.value : 0), 0);

                                                <div key={freq} style={{marginBottom: '0.25rem'}}>
                                                    <div
                                                        style={{display:'flex', alignItems:'center', gap:'0.6rem', cursor:'pointer', padding:'0.35rem 0.25rem', borderRadius:'6px', userSelect:'none'}}

                                                        <span style={{fontSize:'0.72rem', fontWeight:700, color:'rgba(255,255,255,0.85)'}}>{freq}</span>
                                                        <span style={{fontSize:'0.65rem', color:'rgba(255,255,255,0.4)'}}>
                                                            {unusedCount} unused · {freqBenefits.length} total{totalVal > 0 ? ` · $${Math.round(totalVal)}` : ''}
                                                        </span>
                                                        <span style={{marginLeft:'auto', fontSize:'0.6rem', opacity:0.45}}>{isOpen ? '▲' : '▼'}</span>
                                                    </div>

                                                        <div className="benefits-grid" style={{marginTop:'0.25rem', paddingTop:0, paddingLeft:0, paddingRight:0, paddingBottom:'0.25rem'}}>

                                                                <div
                                                                    key={`${card.id}-${originalIndex}`}
                                                                    className={`benefit ${getBenefitTypeClass(benefit.type)} ${isUsed ? 'used' : ''}`}

                                                                    <div style={{fontSize:'0.68rem', color:'rgba(255,255,255,0.45)', marginBottom:'0.15rem'}}>{card.cardName}</div>
                                                                    <div className="benefit-value">

                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                        })}
                                    </div>
                                )}
                            </div>
                        </div>

                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `credit-card-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;

                            const availableCount = currentBenefits.filter(b =>

                            ).length;

                            const sortedBenefits = [...currentBenefits].sort((a, b) =>

                                        <div className="card-stat">
                                            <div className="card-stat-label">Available</div>
                                            <div className="card-stat-value">{availableCount}</div>

                                            <div className="card-stat-label">YTD</div>
                                            <div className="card-stat-value">${Math.round(stats.usedAnnualValue)}</div>

                                            <div className="card-stat-label">Recovery</div>
                                            <div className={`card-stat-value ${recoveryClass}`}>{recoveryPct}%</div>

                                    <div className="card-progress">
                                        <div className={`card-progress-fill ${recoveryClass}`} style={{width: `${recoveryPct}%`}} />

                                                return (
                                                    <span
                                                        key={originalIndex}
                                                        className={`tile-benefit-chip ${getBenefitTypeClass(benefit.type)} ${isUsed ? 'used' : ''}`}
                                                        title={benefit.name}
                                                    >
                                                        {benefit.monetaryValue !== undefined ? `$${benefit.monetaryValue} ` : typeof benefit.value === 'number' ? `$${benefit.value} ` : ''}{benefit.name}
                                                    </span>

                                            })
                                        )}
                                    </div>

                                    <div className={`benefits-container ${isExpanded ? 'open' : ''}`}>

                                                return (
                                                    <div
                                                        key={originalIndex}
                                                        className={`benefit ${getBenefitTypeClass(benefit.type)} ${isUsed ? 'used' : ''}`}

                                                        <div className="benefit-name">{benefit.name}</div>
                                                        <div className="benefit-type">{benefit.type}</div>
                                                        <div className="benefit-value">
                                                            {benefit.monetaryValue !== undefined ? `$${benefit.monetaryValue}` : typeof benefit.value === 'number' ? `$${benefit.value}` : benefit.value}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        </div>

                                <div style={{fontSize: '0.875rem', color: 'rgba(255,255,255,0.7)', marginBottom: '0.5rem'}}>
                                    {data.issuer} • ${data.annualFee} AF • {data.periodicBenefits.length} benefits
                                </div>
                                <button 
                                    className="btn btn-sm"
                                    onClick={() => {
                                        setEditingCardName(name);
                                        setShowEditBenefitsModal(true);
                                    }}

                                    Edit Benefits
                                </button>
                            </div>
                        ))}
                    </div>

            );

                    return (

                        </div>
                    );
                }

                const wallet5 = calculateOptimalWallet(5);
                const wallet7 = calculateOptimalWallet(7);

                const totalSpending = Object.values(annualSpending).reduce((a, b) => a + b, 0);
                const usingSpendData = totalSpending > 0;

                        <div className="spending-grid">

                                    <div key={category} className="spending-input-group">

                                                    )}

                                    </div>

                                </div>
                            </div>

                                                        <select className="form-select" value={editingBenefitData.type}
                                                            onChange={e => setEditingBenefitData({...editingBenefitData, type: e.target.value})}>
                                                            <option>Dining</option><option>Travel</option><option>Shop</option>
                                                        </select>
                                                        <select className="form-select" value={editingBenefitData.frequency}
                                                            onChange={e => setEditingBenefitData({...editingBenefitData, frequency: e.target.value})}>

                                                            value={editingBenefitData.period || ''}
                                                            onChange={e => setEditingBenefitData({...editingBenefitData, period: e.target.value || undefined})} />

                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                    <div>
                                                        <div style={{fontWeight: 600, fontSize: '0.875rem'}}>{benefit.name}</div>
                                                        <div style={{fontSize: '0.72rem', color: 'rgba(255,255,255,0.55)'}}>
                                                            {benefit.frequency}{benefit.period ? ` · ${benefit.period}` : ''} · {benefit.type} ·{' '}
                                                            {benefit.monetaryValue !== undefined
                                                                ? <span style={{color: '#6ee7b7'}}>${benefit.monetaryValue} <span style={{opacity:0.6}}>(≈ {typeof benefit.value === 'number' ? `$${benefit.value}` : benefit.value})</span></span>
                                                                : (typeof benefit.value === 'number' ? `$${benefit.value}` : benefit.value)
                                                            }
                                                        </div>
                                                    </div>
                                                    <div style={{display: 'flex', gap: '0.4rem', flexShrink: 0}}>
                                                        <button className="btn btn-sm" onClick={() => {
                                                            setEditingBenefitIdx(idx);
                                                            setEditingBenefitData({...benefit});
                                                        }}>Edit</button>
                                                        <button className="btn btn-sm" onClick={() => removeBenefitFromCard(editingCardName, idx)}>✕</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div style={{marginTop: '1.25rem', paddingTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.1)'}}>
                                    <div style={{fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.6rem', color: 'rgba(255,255,255,0.7)'}}>Add Benefit</div>
                                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.4rem', marginBottom: '0.75rem'}}>
                                        <input className="form-input" placeholder="Name"
                                            value={newBenefitForm.name}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, name: e.target.value})} />
                                        <select className="form-select" value={newBenefitForm.type}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, type: e.target.value})}>
                                            <option>Dining</option><option>Travel</option><option>Shop</option>
                                        </select>
                                        <select className="form-select" value={newBenefitForm.frequency}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, frequency: e.target.value})}>
                                            <option>Monthly</option><option>Quarterly</option><option>Semi-Annual</option><option>Annual</option>
                                        </select>
                                        <input className="form-input" placeholder="Period (M1, Q2, H1…)"
                                            value={newBenefitForm.period}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, period: e.target.value})} />
                                        <input className="form-input" placeholder="Display value (text or $)"
                                            value={newBenefitForm.value}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, value: e.target.value})} />
                                        <input type="number" className="form-input" placeholder="$ for stats (optional)"
                                            value={newBenefitForm.monetaryValue || ''}
                                            onChange={e => setNewBenefitForm({...newBenefitForm, monetaryValue: e.target.value})} />
                                    </div>
                                    <div style={{display: 'flex', gap: '0.75rem'}}>
                                        <button className="btn" onClick={addBenefitToCard}>Add Benefit</button>
                                        <button className="btn" onClick={() => { setShowEditBenefitsModal(false); setEditingBenefitIdx(null); }}>Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showImportModal && (
                        <div className="modal-overlay" onClick={() => setShowImportModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Import Data</h2>
                                <div className="form-group">
                                    <label className="form-label">Select backup file (JSON)</label>
                                    <input 
                                        type="file"
                                        accept=".json"
                                        className="form-input"
                                        onChange={importData}
                                    />
                                </div>
                                <div style={{padding: '1rem', background: 'rgba(255,193,7,0.1)', borderRadius: '8px', marginTop: '1rem'}}>
                                    <strong>⚠️ Warning:</strong> Importing will replace all current data. Make sure to export your current data first!
                                </div>
                                <button className="btn" onClick={() => setShowImportModal(false)} style={{marginTop: '1rem'}}>Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
