quired":20000,"yearType":"Membership Year"}],"multipliers":{"AA Purchases":2,"Everything Else":1}}};
        
        const SPENDING_CATEGORIES = [
            "Dining", "Supermarkets", "Gas Stations", "Travel", "Hotels",
            "Flights", "Office Supply", "Internet/Cable/Phone", "Shipping",
            "Drugstores", "Rideshare", "Streaming", "Everything Else"
        ];

        const getCurrentMonth = () => new Date().getMonth() + 1;
        const getCurrentQuarter = () => Math.ceil(getCurrentMonth() / 3);
        const getCurrentHalf = () => getCurrentMonth() <= 6 ? 1 : 2;
        const getCurrentYear = () => new Date().getFullYear();

        const getPeriodKey = (frequency, period) => {
            const year = getCurrentYear();
            if (frequency === 'Monthly' && period) return `${year}-${period}`;
            if (frequency === 'Quarterly' && period) return `${year}-${period}`;
            if (frequency === 'Semi-Annual' && period) return `${year}-${period}`;
            if (frequency === 'Annual') return `${year}`;
            return `${year}-M${getCurrentMonth()}`;
        };

        const isCurrentPeriod = (benefit) => {
            if (benefit.frequency === 'Monthly') {
                if (benefit.period && benefit.period.startsWith('M')) {
                    return parseInt(benefit.period.substring(1)) === getCurrentMonth();
                }
                return true;
            }
            if (benefit.frequency === 'Quarterly') return benefit.period === `Q${getCurrentQuarter()}`;
            if (benefit.frequency === 'Semi-Annual') return benefit.period === `H${getCurrentHalf()}`;
            if (benefit.frequency === 'Annual') return true;
            return false;
        };

        function ProgressCircle({ percentage }) {
            const size = 56;
            const strokeWidth = 4;
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percentage / 100) * circumference;

            return (
                <div className="progress-circle">
                    <svg className="progress-svg" viewBox={`0 0 ${size} ${size}`}>
                        <circle className="progress-bg" cx={size/2} cy={size/2} r={radius} />
                        <circle 
                            className="progress-bar" 
                            cx={size/2} cy={size/2} r={radius}
                            strokeDasharray={circumference}
                            strokeDashoffset={offset}
                        />
                    </svg>
                    <div className="progress-text">{Math.round(percentage)}%</div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [profiles, setProfiles] = useState([]);
            const [cards, setCards] = useState([]);
            const [cardDatabase, setCardDatabase] = useState(INITIAL_CARD_DATABASE);
            const [expandedCards, setExpandedCards] = useState({});
            const [usedBenefits, setUsedBenefits] = useState({});
            const [annualSpending, setAnnualSpending] = useState({});
            
            const [showAddCardModal, setShowAddCardModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showDatabaseModal, setShowDatabaseModal] = useState(false);
            const [showEditCardModal, setShowEditCardModal] = useState(false);
            const [showEditBenefitsModal, setShowEditBenefitsModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            
            const [selectedProfile, setSelectedProfile] = useState('');
            const [newProfileName, setNewProfileName] = useState('');
            const [editingCardName, setEditingCardName] = useState('');
            const [newCardForm, setNewCardForm] = useState({ name: '', issuer: '', annualFee: 0 });
            const [newBenefitForm, setNewBenefitForm] = useState({
                name: '', type: 'Dining', frequency: 'Monthly', value: 0, period: ''
            });

            useEffect(() => {
                loadData();
            }, []);

            const loadData = () => {
                try {
                    const profilesData = localStorage.getItem('profiles');
                    const cardsData = localStorage.getItem('cards');
                    const databaseData = localStorage.getItem('card-database');
                    const benefitsData = localStorage.getItem('used-benefits');
                    const spendingData = localStorage.getItem('annual-spending');
                    
                    if (profilesData) setProfiles(JSON.parse(profilesData));
                    if (cardsData) setCards(JSON.parse(cardsData));
                    if (databaseData) setCardDatabase(JSON.parse(databaseData));
                    if (benefitsData) setUsedBenefits(JSON.parse(benefitsData));
                    if (spendingData) setAnnualSpending(JSON.parse(spendingData));
                } catch (error) {
                    console.log('No saved data');
                }
            };

            const saveData = () => {
                try {
                    localStorage.setItem('profiles', JSON.stringify(profiles));
                    localStorage.setItem('cards', JSON.stringify(cards));
                    localStorage.setItem('card-database', JSON.stringify(cardDatabase));
                    localStorage.setItem('used-benefits', JSON.stringify(usedBenefits));
                    localStorage.setItem('annual-spending', JSON.stringify(annualSpending));
                } catch (error) {
                    console.error('Save error:', error);
                }
            };

            useEffect(() => {
                if (profiles.length > 0 || cards.length > 0 || Object.keys(cardDatabase).length > 0) {
                    saveData();
                }
            }, [profiles, cards, cardDatabase, usedBenefits, annualSpending]);

            const addProfile = () => {
                if (newProfileName.trim()) {
                    setProfiles([...profiles, { id: `prof-${Date.now()}`, name: newProfileName.trim() }]);
                    setNewProfileName('');
                }
            };

            const deleteProfile = (profileId) => {
                setProfiles(profiles.filter(p => p.id !== profileId));
                setCards(cards.filter(c => c.profileId !== profileId));
            };

            const addCard = (cardName, profileId) => {
                const cardData = cardDatabase[cardName];
                if (cardData && profileId) {
                    setCards([...cards, {
                        id: `card-${Date.now()}`,
                        profileId,
                        cardName,
                        ...cardData
                    }]);
                    setShowAddCardModal(false);
                    setSelectedProfile('');
                }
            };

            const removeCard = (cardId) => {
                setCards(cards.filter(c => c.id !== cardId));
            };

            const addCardToDatabase = () => {
                if (newCardForm.name && newCardForm.issuer) {
                    setCardDatabase({
                        ...cardDatabase,
                        [newCardForm.name]: {
                            issuer: newCardForm.issuer,
                            annualFee: parseFloat(newCardForm.annualFee) || 0,
                            periodicBenefits: [],
                            multipliers: { "Everything Else": 1 }
                        }
                    });
                    setNewCardForm({ name: '', issuer: '', annualFee: 0 });
                    setShowDatabaseModal(false);
                }
            };

            const addBenefitToCard = () => {
                if (editingCardName && newBenefitForm.name) {
                    const card = cardDatabase[editingCardName];
                    const updatedBenefits = [
                        ...(card.periodicBenefits || []),
                        {
                            name: newBenefitForm.name,
                            type: newBenefitForm.type,
                            frequency: newBenefitForm.frequency,
                            value: parseFloat(newBenefitForm.value) || 0,
                            period: newBenefitForm.period || undefined
                        }
                    ];
                    
                    setCardDatabase({
                        ...cardDatabase,
                        [editingCardName]: {
                            ...card,
                            periodicBenefits: updatedBenefits
                        }
                    });
                    
                    setNewBenefitForm({ name: '', type: 'Dining', frequency: 'Monthly', value: 0, period: '' });
                }
            };

            const removeBenefitFromCard = (cardName, benefitIndex) => {
                const card = cardDatabase[cardName];
                const updatedBenefits = card.periodicBenefits.filter((_, idx) => idx !== benefitIndex);
                setCardDatabase({
                    ...cardDatabase,
                    [cardName]: {
                        ...card,
                        periodicBenefits: updatedBenefits
                    }
                });
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (imported.profiles) setProfiles(imported.profiles);
                            if (imported.cards) setCards(imported.cards);
                            if (imported.cardDatabase) setCardDatabase(imported.cardDatabase);
                            if (imported.usedBenefits) setUsedBenefits(imported.usedBenefits);
                            if (imported.annualSpending) setAnnualSpending(imported.annualSpending);
                            setShowImportModal(false);
                            alert('Data imported successfully!');
                        } catch (error) {
                            alert('Error importing data. Please check the file format.');
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const toggleCard = (cardId) => {
                setExpandedCards(prev => ({ ...prev, [cardId]: !prev[cardId] }));
            };

            const toggleBenefit = (cardId, benefitIndex, benefit) => {
                if (!isCurrentPeriod(benefit)) return;
                const periodKey = getPeriodKey(benefit.frequency, benefit.period);
                const key = `${cardId}-${benefitIndex}-${periodKey}`;
                setUsedBenefits(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const isBenefitUsed = (cardId, benefitIndex, benefit) => {
                const periodKey = getPeriodKey(benefit.frequency, benefit.period);
                const key = `${cardId}-${benefitIndex}-${periodKey}`;
                return usedBenefits[key] || false;
            };

            const calculateCardStats = (card) => {
                let totalValue = 0, usedValue = 0;
                card.periodicBenefits.forEach((benefit, idx) => {
                    if (isCurrentPeriod(benefit)) {
                        const val = typeof benefit.value === 'number' ? benefit.value : 0;
                        totalValue += val;
                        if (isBenefitUsed(card.id, idx, benefit)) usedValue += val;
                    }
                });
                const recovery = card.annualFee > 0 ? (usedValue / card.annualFee) * 100 : 0;
                return { totalValue, usedValue, recovery: Math.min(recovery, 100) };
            };

            const getTotalStats = () => {
                let totalFees = 0, totalRecovered = 0;
                cards.forEach(card => {
                    const stats = calculateCardStats(card);
                    totalFees += card.annualFee;
                    totalRecovered += stats.usedValue;
                });
                return {
                    totalFees,
                    totalRecovered,
                    overallRecovery: totalFees > 0 ? (totalRecovered / totalFees) * 100 : 0
                };
            };

            const getBestCardForCategory = (category) => {
                let bestCard = null, bestMultiplier = 0;
                cards.forEach(card => {
                    if (!card.multipliers) return;
                    Object.entries(card.multipliers).forEach(([cat, mult]) => {
                        const catLower = cat.toLowerCase();
                        const categoryLower = category.toLowerCase();
                        if (catLower.includes(categoryLower) || categoryLower.includes(catLower.split(' ')[0])) {
                            if (mult > bestMultiplier) {
                                bestMultiplier = mult;
                                bestCard = card.cardName;
                            }
                        }
                    });
                });
                return { card: bestCard || 'None', multiplier: bestMultiplier };
            };

            const calculateOptimalWallet = (walletSize) => {
                const categoryScores = {};
                cards.forEach(card => {
                    if (!card.multipliers) return;
                    let cardScore = 0;
                    Object.values(card.multipliers).forEach(multiplier => {
                        cardScore += multiplier;
                    });
                    categoryScores[card.cardName] = cardScore;
                });
                return Object.entries(categoryScores)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, walletSize)
                    .map(([name]) => name);
            };

            const getProfileName = (profileId) => {
                const profile = profiles.find(p => p.id === profileId);
                return profile ? profile.name : 'Unknown';
            };

            const totalStats = getTotalStats();

            const renderDashboard = () => (
                <>
                    <div className="stats">
                        <div className="stat-box">
                            <div className="stat-label">Total Fees</div>
                            <div className="stat-value">${totalStats.totalFees}</div>
                            <div className="stat-sub">{cards.length} cards</div>
                        </div>
                        <div className="stat-box">
                            <div className="stat-label">Recovered</div>
                            <div className="stat-value">${Math.round(totalStats.totalRecovered)}</div>
                            <div className="stat-sub">from benefits</div>
                        </div>
                        <div className="stat-box">
                            <div className="stat-label">Recovery Rate</div>
                            <div className="stat-value">{Math.round(totalStats.overallRecovery)}%</div>
                            <div className="stat-sub">
                                {totalStats.overallRecovery >= 100 ? 'Fully covered' : 
                                 `$${Math.round(totalStats.totalFees - totalStats.totalRecovered)} left`}
                            </div>
                        </div>
                    </div>

                    <div className="actions-bar">
                        <button className="btn" onClick={() => setShowAddCardModal(true)}>+ Add Card</button>
                        <button className="btn" onClick={() => setShowProfileModal(true)}>Manage Profiles</button>
                        <button className="btn" onClick={() => setShowDatabaseModal(true)}>Add Card to Database</button>
                        <button className="btn" onClick={() => {
                            const data = {
                                profiles,
                                cards,
                                cardDatabase,
                                usedBenefits,
                                annualSpending,
                                exportDate: new Date().toISOString()
                            };
                            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `credit-card-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                            a.click();
                        }}>Export Data</button>
                        <button className="btn" onClick={() => setShowImportModal(true)}>Import Data</button>
                    </div>

                    {cards.length === 0 ? (
                        <div className="empty">
                            <div className="empty-icon">💳</div>
                            <div>Create a profile and add cards to start tracking!</div>
                            <div style={{marginTop: '1.5rem'}}>
                                <button className="btn" onClick={() => setShowProfileModal(true)}>Create Profile</button>
                            </div>
                        </div>
                    ) : (
                        cards.map(card => {
                            const stats = calculateCardStats(card);
                            const isExpanded = expandedCards[card.id];
                            const currentBenefits = card.periodicBenefits.filter(b => isCurrentPeriod(b));
                            const availableCount = currentBenefits.filter((b, idx) => 
                                !isBenefitUsed(card.id, card.periodicBenefits.indexOf(b), b)
                            ).length;

                            return (
                                <div key={card.id} className="card-section">
                                    <div className="card-header" onClick={() => toggleCard(card.id)}>
                                        <div className="card-header-left">
                                            <ProgressCircle percentage={stats.recovery} />
                                            <div>
                                                <div className="card-name">
                                                    {card.cardName}
                                                    <span className="profile-badge">{getProfileName(card.profileId)}</span>
                                                </div>
                                                <div className="card-issuer">{card.issuer}</div>
                                            </div>
                                        </div>
                                        <div className="card-stats">
                                            <div className="card-stat">
                                                <div className="card-stat-label">Fee</div>
                                                <div className="card-stat-value">${card.annualFee}</div>
                                            </div>
                                            <div className="card-stat">
                                                <div className="card-stat-label">Available</div>
                                                <div className="card-stat-value">{availableCount}</div>
                                            </div>
                                            <div className="card-stat">
                                                <div className="card-stat-label">Used</div>
                                                <div className="card-stat-value">${Math.round(stats.usedValue)}</div>
                                            </div>
                                            <button 
                                                className="btn btn-sm"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    if (confirm(`Remove ${card.cardName} from ${getProfileName(card.profileId)}?`)) {
                                                        removeCard(card.id);
                                                    }
                                                }}
                                                style={{marginLeft: '1rem'}}
                                            >
                                                Remove
                                            </button>
                                            <div className={`toggle ${isExpanded ? 'open' : ''}`}>▼</div>
                                        </div>
                                    </div>
                                    
                                    <div className={`benefits-container ${isExpanded ? 'open' : ''}`}>
                                        <div className="benefits-grid">
                                            {currentBenefits.map((benefit, idx) => {
                                                const originalIndex = card.periodicBenefits.indexOf(benefit);
                                                const isUsed = isBenefitUsed(card.id, originalIndex, benefit);
                                                
                                                return (
                                                    <div 
                                                        key={originalIndex} 
                                                        className={`benefit ${isUsed ? 'used' : ''}`}
                                                        onClick={() => toggleBenefit(card.id, originalIndex, benefit)}
                                                    >
                                                        <div className="badge">{benefit.frequency}</div>
                                                        <div className="benefit-name">{benefit.name}</div>
                                                        <div className="benefit-type">{benefit.type}</div>
                                                        <div className="benefit-value">
                                                            ${typeof benefit.value === 'number' ? benefit.value : benefit.value}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            );
                        })
                    )}
                </>
            );

            const renderDatabase = () => (
                <>
                    <h2 style={{marginBottom: '2rem'}}>Card Database Management</h2>
                    <div className="actions-bar">
                        <button className="btn" onClick={() => setShowDatabaseModal(true)}>+ Add New Card</button>
                    </div>
                    <div style={{display: 'grid', gap: '1rem'}}>
                        {Object.entries(cardDatabase).map(([name, data]) => (
                            <div key={name} className="card-option">
                                <div style={{fontWeight: 700, marginBottom: '0.5rem'}}>{name}</div>
                                <div style={{fontSize: '0.875rem', color: 'rgba(255,255,255,0.7)', marginBottom: '0.5rem'}}>
                                    {data.issuer} • ${data.annualFee} AF • {data.periodicBenefits.length} benefits
                                </div>
                                <button 
                                    className="btn btn-sm"
                                    onClick={() => {
                                        setEditingCardName(name);
                                        setShowEditBenefitsModal(true);
                                    }}
                                >
                                    Edit Benefits
                                </button>
                            </div>
                        ))}
                    </div>
                </>
            );

            const renderOptimizer = () => {
                if (cards.length === 0) {
                    return (
                        <div className="empty">
                            <div className="empty-icon">📊</div>
                            <div>Add cards to see spend optimization</div>
                        </div>
                    );
                }

                const wallet3 = calculateOptimalWallet(3);
                const wallet5 = calculateOptimalWallet(5);
                const wallet7 = calculateOptimalWallet(7);

                return (
                    <>
                        <h2 style={{marginBottom: '2rem'}}>Wallet Optimization</h2>
                        <div className="spending-grid">
                            {SPENDING_CATEGORIES.map(category => {
                                const { card, multiplier } = getBestCardForCategory(category);
                                const spending = annualSpending[category] || 0;
                                const points = spending * multiplier;
                                
                                return (
                                    <div key={category} className="spending-input-group">
                                        <div className="spending-label">{category}</div>
                                        <input 
                                            type="number"
                                            className="spending-input"
                                            placeholder="$0"
                                            value={annualSpending[category] || ''}
                                            onChange={(e) => setAnnualSpending({
                                                ...annualSpending,
                                                [category]: parseFloat(e.target.value) || 0
                                            })}
                                        />
                                        {spending > 0 && (
                                            <div style={{fontSize: '0.75rem', marginTop: '0.5rem', color: 'rgba(255,255,255,0.7)'}}>
                                                Best: {card} ({multiplier}x) = {Math.round(points)} pts
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div style={{marginTop: '3rem'}}>
                            <h3 style={{marginBottom: '1rem'}}>Optimal Wallets</h3>
                            <div style={{display: 'grid', gap: '1rem'}}>
                                <div className="card-option">
                                    <div style={{fontWeight: 700, marginBottom: '0.5rem'}}>3-Card Daily Carry</div>
                                    <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                                        {wallet3.map(card => (
                                            <span key={card} className="badge">{card}</span>
                                        ))}
                                    </div>
                                </div>
                                <div className="card-option">
                                    <div style={{fontWeight: 700, marginBottom: '0.5rem'}}>5-Card Travel Setup</div>
                                    <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                                        {wallet5.map(card => (
                                            <span key={card} className="badge">{card}</span>
                                        ))}
                                    </div>
                                </div>
                                <div className="card-option">
                                    <div style={{fontWeight: 700, marginBottom: '0.5rem'}}>7-Card Maximum</div>
                                    <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                                        {wallet7.map(card => (
                                            <span key={card} className="badge">{card}</span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </>
                );
            };

            return (
                <div className="container">
                    <header className="header">
                        <h1>Credit Card Rewards Tracker</h1>
                        <div className="tabs">
                            <div className={`tab ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                                Dashboard
                            </div>
                            <div className={`tab ${activeTab === 'optimize' ? 'active' : ''}`} onClick={() => setActiveTab('optimize')}>
                                Optimize
                            </div>
                            <div className={`tab ${activeTab === 'database' ? 'active' : ''}`} onClick={() => setActiveTab('database')}>
                                Database
                            </div>
                        </div>
                    </header>

                    {activeTab === 'dashboard' && renderDashboard()}
                    {activeTab === 'optimize' && renderOptimizer()}
                    {activeTab === 'database' && renderDatabase()}

                    {showAddCardModal && (
                        <div className="modal-overlay" onClick={() => setShowAddCardModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Add Card to Wallet</h2>
                                <div className="form-group">
                                    <label className="form-label">Profile</label>
                                    <select className="form-select" value={selectedProfile} onChange={(e) => setSelectedProfile(e.target.value)}>
                                        <option value="">Choose profile...</option>
                                        {profiles.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                </div>
                                {selectedProfile && (
                                    <div className="form-group">
                                        {Object.entries(cardDatabase).map(([name, data]) => (
                                            <div key={name} className="card-option" onClick={() => addCard(name, selectedProfile)}>
                                                <div style={{fontWeight: 700}}>{name}</div>
                                                <div style={{fontSize: '0.875rem', color: 'rgba(255,255,255,0.7)'}}>
                                                    {data.issuer} • ${data.annualFee} AF
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <button className="btn" onClick={() => setShowAddCardModal(false)}>Close</button>
                            </div>
                        </div>
                    )}

                    {showProfileModal && (
                        <div className="modal-overlay" onClick={() => setShowProfileModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Manage Profiles</h2>
                                <div className="profile-list">
                                    {profiles.map(profile => (
                                        <div key={profile.id} className="profile-item">
                                            <div>{profile.name}</div>
                                            <button className="btn btn-sm" onClick={() => deleteProfile(profile.id)}>Delete</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="form-group">
                                    <label className="form-label">New Profile</label>
                                    <input 
                                        className="form-input"
                                        placeholder="Name"
                                        value={newProfileName}
                                        onChange={(e) => setNewProfileName(e.target.value)}
                                    />
                                </div>
                                <div style={{display: 'flex', gap: '1rem'}}>
                                    <button className="btn" onClick={addProfile}>Add</button>
                                    <button className="btn" onClick={() => setShowProfileModal(false)}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showDatabaseModal && (
                        <div className="modal-overlay" onClick={() => setShowDatabaseModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Add Card to Database</h2>
                                <div className="form-group">
                                    <label className="form-label">Card Name</label>
                                    <input 
                                        className="form-input"
                                        value={newCardForm.name}
                                        onChange={(e) => setNewCardForm({...newCardForm, name: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Issuer</label>
                                    <input 
                                        className="form-input"
                                        value={newCardForm.issuer}
                                        onChange={(e) => setNewCardForm({...newCardForm, issuer: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Annual Fee</label>
                                    <input 
                                        type="number"
                                        className="form-input"
                                        value={newCardForm.annualFee}
                                        onChange={(e) => setNewCardForm({...newCardForm, annualFee: e.target.value})}
                                    />
                                </div>
                                <div style={{display: 'flex', gap: '1rem'}}>
                                    <button className="btn" onClick={addCardToDatabase}>Add</button>
                                    <button className="btn" onClick={() => setShowDatabaseModal(false)}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditBenefitsModal && (
                        <div className="modal-overlay" onClick={() => setShowEditBenefitsModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Edit Benefits: {editingCardName}</h2>
                                <div className="benefit-list">
                                    {cardDatabase[editingCardName]?.periodicBenefits.map((benefit, idx) => (
                                        <div key={idx} className="benefit-list-item">
                                            <div>
                                                <div style={{fontWeight: 600}}>{benefit.name}</div>
                                                <div style={{fontSize: '0.75rem', color: 'rgba(255,255,255,0.7)'}}>
                                                    {benefit.frequency} • ${benefit.value}
                                                </div>
                                            </div>
                                            <button 
                                                className="btn btn-sm" 
                                                onClick={() => removeBenefitFromCard(editingCardName, idx)}
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Add Benefit</label>
                                    <input 
                                        className="form-input"
                                        placeholder="Name"
                                        value={newBenefitForm.name}
                                        onChange={(e) => setNewBenefitForm({...newBenefitForm, name: e.target.value})}
                                        style={{marginBottom: '0.5rem'}}
                                    />
                                    <select 
                                        className="form-select"
                                        value={newBenefitForm.type}
                                        onChange={(e) => setNewBenefitForm({...newBenefitForm, type: e.target.value})}
                                        style={{marginBottom: '0.5rem'}}
                                    >
                                        <option>Dining</option>
                                        <option>Travel</option>
                                        <option>Shop</option>
                                    </select>
                                    <select 
                                        className="form-select"
                                        value={newBenefitForm.frequency}
                                        onChange={(e) => setNewBenefitForm({...newBenefitForm, frequency: e.target.value})}
                                        style={{marginBottom: '0.5rem'}}
                                    >
                                        <option>Monthly</option>
                                        <option>Quarterly</option>
                                        <option>Semi-Annual</option>
                                        <option>Annual</option>
                                    </select>
                                    <input 
                                        type="number"
                                        className="form-input"
                                        placeholder="Value"
                                        value={newBenefitForm.value}
                                        onChange={(e) => setNewBenefitForm({...newBenefitForm, value: e.target.value})}
                                        style={{marginBottom: '0.5rem'}}
                                    />
                                    <input 
                                        className="form-input"
                                        placeholder="Period (e.g., M2, Q1, H1)"
                                        value={newBenefitForm.period}
                                        onChange={(e) => setNewBenefitForm({...newBenefitForm, period: e.target.value})}
                                    />
                                </div>
                                <div style={{display: 'flex', gap: '1rem'}}>
                                    <button className="btn" onClick={addBenefitToCard}>Add Benefit</button>
                                    <button className="btn" onClick={() => setShowEditBenefitsModal(false)}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showImportModal && (
                        <div className="modal-overlay" onClick={() => setShowImportModal(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>Import Data</h2>
                                <div className="form-group">
                                    <label className="form-label">Select backup file (JSON)</label>
                                    <input 
                                        type="file"
                                        accept=".json"
                                        className="form-input"
                                        onChange={importData}
                                    />
                                </div>
                                <div style={{padding: '1rem', background: 'rgba(255,193,7,0.1)', borderRadius: '8px', marginTop: '1rem'}}>
                                    <strong>⚠️ Warning:</strong> Importing will replace all current data. Make sure to export your current data first!
                                </div>
                                <button className="btn" onClick={() => setShowImportModal(false)} style={{marginTop: '1rem'}}>Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
